# Owner(s): ["module: ci"]
name: Populate ClickHouse Owners

on:
  pull_request:
    paths:
      - CODEOWNERS
      - .github/workflows/populate-clickhouse-owners.yml
      - torch/testing/_internal/owners.py
      - torch/testing/_internal/torchci/populate_clickhouse_owners.py
      - test/test_torchci.py
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  populate-owners:
    if: github.repository_owner == 'pytorch'
    runs-on: ubuntu-24.04
    environment: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && 'clickhouse-owners' || '' }}
    env:
      UPLOAD_TO_CLICKHOUSE: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout PyTorch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'

      - name: Install ClickHouse client
        if: env.UPLOAD_TO_CLICKHOUSE == 'true'
        run: pip install clickhouse-connect==0.8.14

      - name: Populate test owners
        env:
          PYTHONPATH: ${{ github.workspace }}
          CLICKHOUSE_ENDPOINT: ${{ env.UPLOAD_TO_CLICKHOUSE == 'true' && secrets.CLICKHOUSE_ENDPOINT || '' }}
          CLICKHOUSE_USERNAME: ${{ env.UPLOAD_TO_CLICKHOUSE == 'true' && secrets.CLICKHOUSE_USERNAME || '' }}
          CLICKHOUSE_PASSWORD: ${{ env.UPLOAD_TO_CLICKHOUSE == 'true' && secrets.CLICKHOUSE_PASSWORD || '' }}
        run: python torch/testing/_internal/torchci/populate_clickhouse_owners.py --database fortesting
